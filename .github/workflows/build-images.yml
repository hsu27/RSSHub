name:  Build Docker image

on:
    # schedule:
        # - cron: '30 0 5,25 * *' # 每月 5 號與 25 號 00:30 UTC 自動跑
    workflow_dispatch: # 允許手動觸發

permissions:
    contents: write # 同步/推送 branch 需要
    packages: write # 推 image 到 ghcr 需要

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # 注意：若有分支保護，建議將下方換成自訂的 PAT (Personal Access Token)
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 處理 GitHub 帳號包含大寫字母的情況，轉為小寫給 Docker 使用
            - name: Downcase repository owner
              id: repo_owner
              run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/rsshub:latest
